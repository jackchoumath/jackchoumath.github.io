<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schubert Calculus — thumbnail</title>
<link rel="stylesheet" href="film.css">
<style>
  html, body { margin: 0; background: #05070c; }
  #t { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #05070c; }
  /* Spotlight behind the puzzle, warm into cool. */
  #t::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(900px 760px at 1460px 540px, rgba(52,34,10,0.85), rgba(12,36,66,0.35) 55%, rgba(5,7,12,0) 80%); }
  .dots { position: absolute; inset: 0; opacity: 0.07;
    background-image: radial-gradient(rgba(170,190,220,1) 1.2px, transparent 1.3px); background-size: 48px 48px; }
  .glow, .puzzle { position: absolute; left: 1078px; top: 150px; width: 792px; height: 747px; }
  .glow { filter: blur(34px) brightness(1.7) saturate(1.3); opacity: 0.55; mix-blend-mode: screen; }
  .puzzle { mix-blend-mode: screen; }
  .kicker { position: absolute; left: 112px; top: 250px; font: 600 38px "JetBrains Mono", monospace; letter-spacing: 6px; color: #7d8ea6; }
  .title { position: absolute; left: 104px; top: 300px; font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: normal;
    font-size: 158px; line-height: 0.92; color: #f3efe6; letter-spacing: -1px; text-shadow: 0 0 40px rgba(0,0,0,0.6); }
  .bar { position: absolute; left: 112px; top: 650px; width: 300px; height: 10px; background: #ffc845; box-shadow: 0 0 30px rgba(255,200,69,0.7); }
  .years { position: absolute; left: 106px; top: 690px; font: 900 132px "Big Shoulders Display", sans-serif; color: #ffc845; letter-spacing: 2px;
    text-shadow: 0 0 36px rgba(255,200,69,0.45); }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
</style>
</head>
<body>
<div id="t">
  <div class="dots"></div>
  <img class="glow" src="thumb-puzzle.png" alt="">
  <img class="puzzle" src="thumb-puzzle.png" alt="">
  <div class="vig"></div>
  <div class="kicker">THE HISTORY OF</div>
  <div class="title">SCHUBERT<br>CALCULUS</div>
  <div class="bar"></div>
  <div class="years">1879 → TODAY</div>
</div>
</body>
</html>
