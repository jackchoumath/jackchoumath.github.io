<!doctype html>
<html><head><meta charset="utf-8"><title>motif test</title><link rel="stylesheet" href="film.css"></head>
<body><div id="stage"><canvas id="main" width="1920" height="1080"></canvas></div>
<script src="engine.js"></script>
<script src="motifs/api.js"></script>
<script>
// Usage: motif-test.html?id=<motif>&dur=1.9   seek(t): t in [0,1] -> full frame at p=t;
// t >= 5 -> 3x2 contact sheet at p = .08 .2 .35 .55 .8 1.0 (panel boxes ~600x450).
// &stage=1 : the 75-second film's centre stage (box 1260x670 at 330,125; sheet panels 600x320);
// &stage=hero : the hero stage (1420x700 at 250,110). Everything below y = 812 is the film's
// lower third (year, headline, citations), shown here as a shaded band.
(async function () {
  const q = new URLSearchParams(location.search);
  const id = q.get('id'), dur = Number(q.get('dur') || 1.9), BEAT = 60 / 128;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = `motifs/${id}.js`; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  const fonts = ['900 100px "Big Shoulders Display"', '100px Anton', '900 100px Archivo', 'italic 100px "Instrument Serif"', '100px "Instrument Serif"',
    '500 40px "JetBrains Mono"', '40px KaTeX_Main', 'italic 40px KaTeX_Math', '40px KaTeX_Fraktur', '40px KaTeX_AMS', '600 40px Inter'];
  await Promise.all(fonts.map(f => document.fonts.load(f)));
  const { W, H, makeCanvas, bloom, rgba } = R;
  const main = document.getElementById('main').getContext('2d');
  const layer = makeCanvas(), ctx = layer.getContext('2d'), hotC = makeCanvas(), hot = hotC.getContext('2d');
  const C = MOTIF_C;
  const stage = q.get('stage');
  const BOX = q.get('box') ? q.get('box').split(',').map(Number) : null;   // &box=x,y,w,h overrides
  const FULL = BOX ? { x: BOX[0], y: BOX[1], w: BOX[2], h: BOX[3] } : stage === 'hero' ? { x: 250, y: 110, w: 1420, h: 700 } : stage ? { x: 330, y: 125, w: 1260, h: 670 } : { x: 560, y: 220, w: 800, h: 600 };
  function panel(p, box) {
    const t = p * dur;
    const k = Math.exp(-((t % BEAT) / 0.12));
    const env = MOTIF_ENV(t, dur, BEAT);
    ctx.save(); hot.save();
    MOTIFS[id].draw(ctx, hot, p, k, env, box);
    ctx.restore(); hot.restore();
  }
  window.seek = t => {
    main.fillStyle = '#05070c'; main.fillRect(0, 0, W, H);
    ctx.clearRect(0, 0, W, H); hot.clearRect(0, 0, W, H);
    ctx.lineCap = hot.lineCap = 'butt';
    if (t >= 5) {
      const ps = [0.08, 0.2, 0.35, 0.55, 0.8, 1.0];
      ps.forEach((p, i) => {
        const x = (i % 3) * 640, y = Math.floor(i / 3) * 540;
        const box = stage ? { x: x + 20, y: y + 90, w: 600, h: Math.round(600 * FULL.h / FULL.w) } : { x: x + 30, y: y + 50, w: 580, h: 440 };
        main.strokeStyle = 'rgba(255,255,255,0.08)'; main.strokeRect(box.x, box.y, box.w, box.h);
        main.fillStyle = 'rgba(255,255,255,0.5)'; main.font = '18px "JetBrains Mono"'; main.fillText(`${id}  p=${p}`, x + 30, y + 34);
        panel(p, box);
      });
    } else {
      const box = FULL;
      if (!q.has('clean')) {           // &clean=1: just the motif (for stills and the thumbnail)
        if (stage) { main.fillStyle = 'rgba(255,255,255,0.035)'; main.fillRect(0, 812, W, H - 812); }
        main.strokeStyle = 'rgba(255,255,255,0.08)'; main.strokeRect(box.x, box.y, box.w, box.h);
        main.fillStyle = 'rgba(255,255,255,0.5)'; main.font = '18px "JetBrains Mono"'; main.fillText(`${id}  p=${t.toFixed(2)}  box ${box.w}x${box.h}  dur ${dur}s`, box.x, box.y - 14);
      }
      panel(Math.min(1, t), box);
    }
    main.drawImage(layer, 0, 0);
    main.drawImage(hotC, 0, 0);
    bloom(main, hotC, 6, 0.6); bloom(main, hotC, 24, 0.45);
  };
  seek(5);
  window.__ready = true;
})();
</script></body></html>
